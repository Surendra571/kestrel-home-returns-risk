version: '3.8'

services:
  kestrel-returns-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kestrel-returns-service
    ports:
      - "8000:8000"
    environment:
      - KESTREL_RISK_THRESHOLD=0.1500
      - KESTREL_MODEL_VERSION=1.0.0
      - KESTREL_LOG_LEVEL=INFO
    restart: unless-stopped

